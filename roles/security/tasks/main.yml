---
- name: Update apt cache and install security packages
  ansible.builtin.apt:
    name: "{{ security_base_packages }}"
    state: present
    update_cache: yes

- name: Disable root login via SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    state: present
  notify: Restart SSH

- name: Allow SSH and configured ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ security_allowed_ports }}"

- name: Enable UFW with default deny incoming policy
  community.general.ufw:
    state: enabled
    policy: deny
